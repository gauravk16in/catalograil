packages:
  - 'packages/*'
  - 'services/*'
  - 'services/workers/*'
  - 'apps/*'
  - 'infra'
  - 'e2e'

allowBuilds:
  esbuild: true
  # Its postinstall only builds a native binding when no prebuilt platform package matches;
  # one does here, so there is nothing to gain from running it.
  unrs-resolver: false
